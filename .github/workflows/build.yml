name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Safety engine tests (build stops if any fail)
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: Speech layer tests (routing, model manager, serial engine)
        run: ./gradlew :speech:test --no-daemon --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/opd-assistant-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opd-assistant-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (download page for your phone)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Prototype test build ${{ github.run_number }}. Install on an Android phone (Android 10 or newer).
            For simulated / role-played consultations only. All clinical content is UNVERIFIED.
            Commit: ${{ github.sha }}

      - name: Keep reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_number }}
          path: |
            engine/build/reports/tests
            speech/build/reports/tests
            app/build/reports
          if-no-files-found: ignore

  # The app with the on-device speech engine (opt-in module :asr-native). Separate and non-blocking on purpose:
  # a problem in the native toolchain must never stop the normal build or its release above.
  build-local-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK with the on-device speech engine
        run: ./gradlew :app:assembleDebug -PenableNativeAsr=true --no-daemon --stacktrace

      - name: Check the native library is really in the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/opd-assistant-local-asr-build-${{ github.run_number }}.apk"
          unzip -l dist/*.apk | grep -E "lib/arm64-v8a/libopd_asr.so" || (echo "libopd_asr.so is missing from the APK" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: opd-assistant-local-asr-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Keep reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-local-asr-${{ github.run_number }}
          path: |
            asr-native/build/outputs
            asr-native/.cxx
            app/build/reports
          if-no-files-found: ignore
