name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon

      - name: Safety engine tests (build stops if any fail)
        run: ./gradlew :engine:test --no-daemon --stacktrace

      - name: App governance unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Summarize failed test reports
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as out:
              for path in glob.glob("app/build/test-results/**/*.xml", recursive=True) + glob.glob("engine/build/test-results/**/*.xml", recursive=True):
                  root = ET.parse(path).getroot()
                  failures = list(root.findall(".//failure")) + list(root.findall(".//error"))
                  if not failures:
                      continue
                  out.write(f"### {path}\n\n```text\n")
                  for failure in failures:
                      message = failure.get("message") or (failure.text or "").strip()
                      out.write(message[:4000] + "\n")
                      safe = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error file={path}::{safe[:4000]}")
                  out.write("```\n")
          PY

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/opd-assistant-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opd-assistant-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (download page for your phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Prototype test build ${{ github.run_number }}. Install on an Android phone (Android 10 or newer).
            For simulated / role-played consultations only. All clinical content is UNVERIFIED.
            Commit: ${{ github.sha }}

      - name: Keep reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ github.run_number }}
          path: |
            engine/build/reports/tests
            app/build/reports
          if-no-files-found: ignore
